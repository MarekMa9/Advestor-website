<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advestor – Pracujeme na webe</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .logo {
      width: min(480px, 80vw);
      display: block;
      margin: 0 auto;
    }

    .message {
      color: #666;
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 2.5rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="images/Logo-advestor.svg" alt="Advestor">
    <p class="message">Pracujeme na webe</p>
  </div>
</body>
</html>
